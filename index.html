<!doctype html>
<html lang="en" style="background-color: #0a0a0f;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Dejavu FM</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dejavu FM" />
    <!-- PWA manifest and icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/pwa-192x192.png" />
    <meta name="msapplication-TileImage" content="/favicon.jpg" />
    <meta name="theme-color" content="#B026FF" />
    <script>
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.add('light');
        document.documentElement.style.backgroundColor = '#f8f9fa';
      } else {
        document.documentElement.style.backgroundColor = '#0a0a0f';
      }
    </script>
    <style>
      @keyframes splashPulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 0; }
        100% { transform: scale(0.95); opacity: 0; }
      }
      @keyframes splashFade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes splashProgress {
        0% { left: -40%; }
        100% { left: 100%; }
      }

      html.light body, html.light #loading-splash {
        background-color: #f8f9fa !important;
        color: #0f172a !important;
      }
      html.light #splash-title {
        color: #0f172a !important;
      }
      html.light #splash-ring {
        border-color: rgba(0, 0, 0, 0.08) !important;
        background-color: rgba(0, 0, 0, 0.03) !important;
      }
      html.light #splash-icon {
        color: #0f172a !important;
      }
      html.light #splash-sub {
        color: rgba(0, 0, 0, 0.4) !important;
      }
      html.light #splash-progress-track {
        background-color: rgba(0, 0, 0, 0.05) !important;
      }
    </style>
  </head>
  <body style="background-color: #0a0a0f; margin: 0; padding: 0;">
    <div id="root">
      <!-- Pure CSS Premium Splash Loader to prevent any blank white screen flash on reload -->
      <div id="loading-splash" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0a0a0f; z-index: 99999; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.5s ease;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <!-- Pulsing Rings -->
          <div id="splash-ring" style="width: 100px; height: 100px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.1); background-color: rgba(255, 255, 255, 0.03); display: flex; align-items: center; justify-content: center; position: relative;">
            <svg id="splash-icon" style="width: 40px; height: 40px; color: #ffffff;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
            </svg>
            <div style="position: absolute; inset: 0; border: 1px solid rgba(176, 38, 255, 0.5); border-radius: 28px; animation: splashPulse 2s infinite ease-out;"></div>
          </div>
        </div>
        <h2 id="splash-title" style="font-size: 24px; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; margin: 0 0 8px 0; color: #ffffff;">
          DEJAVU<span style="color: #B026FF; margin-left: 2px;">FM</span>
        </h2>
        <p id="splash-sub" style="font-size: 10px; font-family: monospace; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); margin: 0 0 32px 0; animation: splashFade 1.5s infinite ease-in-out;">
          Syncing Airwaves
        </p>
        <div id="splash-progress-track" style="width: 180px; height: 2px; background-color: rgba(255, 255, 255, 0.05); border-radius: 999px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, #B026FF, #00F0FF); border-radius: 999px; animation: splashProgress 1.5s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
