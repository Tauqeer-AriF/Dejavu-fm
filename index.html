<!doctype html>
<html lang="en" style="background-color: #0a0a0f;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>dejavufm</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="dejavufm" />
    <!-- PWA manifest and icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/pwa-192x192.png" />
    <meta name="msapplication-TileImage" content="/favicon.jpg" />
    <meta name="theme-color" id="theme-color-meta" content="#0a0a0f" />
    <!-- Preconnect to video streaming CDNs for instant player initialization -->
    <link rel="preconnect" href="https://player.twitch.tv" crossorigin />
    <link rel="preconnect" href="https://static.twitchcdn.net" crossorigin />
    <link rel="preconnect" href="https://usher.ttvnw.net" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" crossorigin />
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://player.twitch.tv" />
    <link rel="dns-prefetch" href="https://static.twitchcdn.net" />
    <script>
      (function() {
        let cachedSettings = null;
        try {
          const raw = localStorage.getItem('dejavufm_cached_public_settings');
          if (raw) {
            cachedSettings = JSON.parse(raw);
          }
        } catch (e) {}

        const savedTheme = localStorage.getItem('theme');
        const defaultThemeFallback = (cachedSettings && cachedSettings.default_theme) || localStorage.getItem('default_theme_fallback');
        const activeTheme = savedTheme || defaultThemeFallback || 'dark';
        
        if (activeTheme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.style.backgroundColor = '#f8f9fa';
        } else {
          document.documentElement.style.backgroundColor = '#0a0a0f';
        }

        if (cachedSettings) {
          // 1. Primary & Secondary Colors
          if (cachedSettings.primary_color) {
            document.documentElement.style.setProperty('--color-neon-purple', cachedSettings.primary_color);
            const metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
              metaThemeColor.setAttribute('content', cachedSettings.primary_color);
            }
          }
          if (cachedSettings.secondary_color) {
            document.documentElement.style.setProperty('--color-neon-blue', cachedSettings.secondary_color);
          }

          // 2. Dynamic Typography
          if (cachedSettings.font_sans) {
            const sansVal = '"' + cachedSettings.font_sans + '", ui-sans-serif, system-ui, sans-serif';
            document.documentElement.style.setProperty('--font-sans', sansVal);
            document.documentElement.style.setProperty('--font-mono', sansVal);
          }
          if (cachedSettings.font_display) {
            let displayFallback = ', sans-serif';
            if (cachedSettings.font_display === 'Playfair Display') displayFallback = ', serif';
            if (cachedSettings.font_display === 'JetBrains Mono') displayFallback = ', monospace';
            document.documentElement.style.setProperty('--font-display', '"' + cachedSettings.font_display + '"' + displayFallback);
          }

          // 3. Dynamic Favicon
          if (cachedSettings.favicon) {
            const link = document.querySelector("link[rel~='icon']");
            if (link) {
              link.href = cachedSettings.favicon;
            }
          }

          // 4. Dynamic Page Title
          const title = cachedSettings.site_title || cachedSettings.app_title || cachedSettings.station_name || cachedSettings.app_name;
          if (title) {
            document.title = title;
            const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.setAttribute('content', title);
          }
        } else {
          // Fallback legacy primary color
          const savedPrimaryColor = localStorage.getItem('branding_primary_color');
          if (savedPrimaryColor) {
            document.documentElement.style.setProperty('--color-neon-purple', savedPrimaryColor);
            const metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
              metaThemeColor.setAttribute('content', savedPrimaryColor);
            }
          }
        }
      })();
    </script>
    <style>
      html.light body, html.light #loading-splash {
        background-color: #f8f9fa !important;
        color: #0f172a !important;
      }
      html.light #splash-logo {
        filter: invert(1);
      }
    </style>
  </head>
  <body style="background-color: #0a0a0f; margin: 0; padding: 0;">
    <!-- Pure CSS/HTML Initial Splash with Branding Logo Image -->
    <div id="loading-splash" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0a0a0f; z-index: 99999; margin: 0; padding: 0; transition: opacity 0.4s ease;">
      <img id="splash-logo" src="/icon.svg" alt="dejavufm" style="width: 320px; max-width: 80vw; height: auto; object-fit: contain;" />
    </div>
    <script>
      (function() {
        try {
          const raw = localStorage.getItem('dejavufm_cached_public_settings');
          if (raw) {
            const s = JSON.parse(raw);
            const isLight = document.documentElement.classList.contains('light');
            const customLogo = isLight ? (s.logo_light || s.logo_url) : (s.logo_dark || s.logo_url);
            if (customLogo) {
              const img = document.getElementById('splash-logo');
              if (img) img.src = customLogo;
            }
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script>
      window.dismissSplash = function() {
        const splash = document.getElementById('loading-splash');
        if (splash && splash.style.display !== 'none') {
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(() => {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }
      };
      // Automatic safety timeout so splash never stays stuck
      setTimeout(function() { if (window.dismissSplash) window.dismissSplash(); }, 1200);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
